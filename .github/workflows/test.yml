name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }}, Mongoose ${{ matrix.mongoose-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]
        mongoose-version: [7, 8, 9]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install mongoose ${{ matrix.mongoose-version }}
        run: npm install mongoose@${{ matrix.mongoose-version }}

      - name: Run tests with coverage
        run: npm run test:coverage -- --reporter=junit --outputFile.junit=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-node-${{ matrix.node-version }}-mongoose-${{ matrix.mongoose-version }}
          path: test-results.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always() && matrix.node-version == '20.x' && matrix.mongoose-version == 9
        with:
          name: coverage
          path: coverage/

      - name: Report coverage
        uses: davelosert/vitest-coverage-report-action@v2
        if: always() && matrix.node-version == '20.x' && matrix.mongoose-version == 9
        with:
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
